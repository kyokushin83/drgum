<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>닥터검역 · 테스트 페이지</title>
<link rel="shortcut icon" href="https://pet-travel.co.kr/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0f5ff;color:#13254b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(640px,100%);padding:clamp(28px,6vw,56px);background:white;border:1px solid #dbe5f5;border-radius:28px;box-shadow:0 24px 80px #193d7512}.badge{display:inline-block;padding:8px 13px;border-radius:99px;background:#e9f8ef;color:#187345;font-size:13px;font-weight:700}h1{font-size:clamp(30px,6vw,46px);letter-spacing:-2px;line-height:1.2;margin:24px 0 16px}p{color:#61708b;line-height:1.8}button,a{display:inline-block;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button{background:#2563eb;color:white}a{background:#edf2fa;color:#29456d;margin-left:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.actions a{margin:0}#message{min-height:30px;color:#187345;font-weight:700;margin-bottom:0}footer{border-top:1px solid #edf0f6;padding-top:20px;margin-top:28px;color:#7a869c;font-size:12px}
</style>
</head>
<body>
<main>
<span class="badge">공개 테스트 페이지</span>
<h1>안녕하세요.<br>페이지가 잘 열렸습니다.</h1>
<p>닥터검역 HTML 테스트 페이지입니다.<br>아래 버튼을 눌러 간단한 동작도 확인해 보세요.</p>
<div class="actions"><button id="testButton" type="button">버튼 테스트</button><a href="/">닥터검역 홈으로</a></div>
<p id="message" role="status" aria-live="polite"></p>
<footer>닥터검역 · 2026년 10월 11일 테스트</footer>
</main>
<script>
document.getElementById('testButton').addEventListener('click',function(){document.getElementById('message').textContent='확인 완료! 버튼도 정상 작동합니다.';});
</script>
</body>
</html>
