<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>닥터검역 Travel Pass 관리자</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="index.html"><span class="logo">✚</span><span>닥터검역<small>Travel Pass Admin</small></span></a>
    <a class="nav-link" href="index.html">공개 견적 홈</a>
  </header>
  <main class="shell page">
    <div class="admin-head"><div><h1>고객 Travel Pass 관리</h1><p>고객 일정과 진행 단계를 한곳에서 관리합니다.</p></div><button id="new-button" disabled class="btn btn-primary">＋ 고객 추가</button></div>
    <div class="notice" style="margin-bottom:18px"><strong>Firestore 고객 관리</strong>관리자 Google 로그인 후 저장합니다. 고객 URL은 지정한 고객 계정으로 로그인해야 열립니다. 현재 보안 규칙 배포 확인을 기다리고 있어 고객 저장·조회가 잠겨 있습니다.</div>
    <div class="card" style="padding:16px;margin-bottom:18px"><span id="auth-status" role="status">로그인 확인 중…</span> <button id="admin-login" class="btn btn-primary" type="button">Google 로그인</button> <button id="admin-logout" class="btn btn-secondary" type="button" hidden>로그아웃</button> <button id="import-local" class="btn btn-secondary" type="button" disabled>이 브라우저의 기존 고객 가져오기</button></div>

    <div class="admin-layout">
      <aside class="card customer-list">
        <div class="list-toolbar"><input id="search" class="search" type="search" placeholder="보호자·반려동물·국가 검색" aria-label="고객 검색"></div>
        <div id="customer-items" class="customer-items"></div>
      </aside>

      <section class="card editor">
        <div class="editor-header"><h2 id="editor-title">고객 정보</h2><span id="id-badge" class="badge"></span></div>
        <form id="customer-form"><fieldset id="editor-fields" disabled style="border:0;padding:0;margin:0;min-width:0">
          <input id="customer-id" type="hidden">
          <div class="form-grid">
            <div class="field"><label for="guardian-name">보호자명 *</label><input id="guardian-name" maxlength="100" required autocomplete="off"></div>
            <div class="field"><label for="pet-name">반려동물명 *</label><input id="pet-name" maxlength="100" required autocomplete="off"></div>
            <div class="field"><label for="country">출국 국가 *</label><input id="country" maxlength="100" required list="country-options" placeholder="예: 일본"><datalist id="country-options"></datalist></div>
            <div class="field"><label for="departure-date">출국일 *</label><input id="departure-date" type="date" required></div>
            <div class="field"><label for="current-step">현재 단계</label><select id="current-step"></select></div>
            <div class="field"><label for="next-visit-date">다음 방문일</label><input id="next-visit-date" type="date"></div>
            <div class="field full"><label for="next-action">다음 할 일</label><textarea id="next-action" maxlength="5000" placeholder="고객에게 보일 다음 준비사항"></textarea></div>
            <div class="field full"><label>완료 단계 <span id="schedule-status" style="font-weight:700;color:#64748b"></span></label><div id="steps-editor" class="steps-editor"></div></div>
            <div class="field full"><label for="memo">관리자 메모 · 고객 화면에 표시</label><textarea id="memo" maxlength="5000" placeholder="고객에게 전달할 안내 메모"></textarea></div>
            <div class="field full"><label for="customer-uid">고객 Firebase Auth UID · URL 열람 계정</label><input id="customer-uid" maxlength="128" autocomplete="off" placeholder="Firebase Authentication에서 확인한 고객 계정 UID"><small>고객이 Google 로그인한 뒤 생성된 UID를 등록하세요. 빈 값이면 관리자만 조회합니다.</small></div>
            <div class="field full"><label for="customer-url">고객 전용 URL</label><div class="url-box"><input id="customer-url" readonly><button id="copy-url" type="button" class="btn btn-secondary">URL 복사</button><a id="open-url" class="btn btn-secondary" target="_blank" rel="noopener">미리보기</a></div></div>
          </div>
          <div class="editor-actions"><button class="btn btn-primary" type="submit">저장하기</button><button id="delete-button" class="btn btn-danger" type="button">고객 삭제</button></div>
        </fieldset></form>
      </section>
    </div>
  </main>
  <footer class="shell footer">닥터검역 · 인증된 관리자 전용</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="admin.js?v=20261011-1"></script>
  <script type="module" src="consultation-admin.js?v=20261011-1"></script>
</body>
</html>
